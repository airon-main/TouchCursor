plugins {
    id 'com.android.application'
}

android {
    namespace 'dev.keymouse'
    compileSdk 35

    defaultConfig {
        applicationId 'dev.keymouse'
        minSdk 26
        targetSdk 28
        versionCode 1
        versionName '0.1.0'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}
