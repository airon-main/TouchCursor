plugins {
    id 'com.android.application'
}

android {
    namespace 'ru.vasys.keymouse'
    compileSdk 35

    defaultConfig {
        applicationId 'ru.vasys.keymouse'
        minSdk 26
        targetSdk 35
        versionCode 10
        versionName '0.4.0'
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt')
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}
