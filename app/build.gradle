plugins {
    id 'com.android.application'
}

android {
    namespace 'ru.vasys.keymouse'
    compileSdk 35

    defaultConfig {
        applicationId 'ru.vasys.keymouse'
        minSdk 26
        targetSdk 28
        versionCode 7
        versionName '0.3.4'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}
